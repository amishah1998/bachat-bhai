name: Check generated files

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compares contents, not bytes: the zip stores file timestamps, so a rebuild never matches byte for byte.
      - name: Committed zip matches skills/bachat-bhai
        run: |
          python3 - <<'PY'
          import pathlib, sys, zipfile
          root = pathlib.Path("skills")
          disk = {p.relative_to(root).as_posix(): p.read_bytes()
                  for p in (root / "bachat-bhai").rglob("*") if p.is_file()}
          with zipfile.ZipFile("dist/bachat-bhai-skill.zip") as z:
              zipped = {n: z.read(n) for n in z.namelist() if not n.endswith("/")}
          stale = sorted(n for n in set(disk) | set(zipped) if disk.get(n) != zipped.get(n))
          for name in stale:
              print(f"::error::{name} differs between skills/ and dist/bachat-bhai-skill.zip. Run bash scripts/build.sh and commit the zip.")
          sys.exit(1 if stale else 0)
          PY

      - name: Committed AGENTS.md matches SKILL.md
        run: |
          bash scripts/build.sh
          if ! git diff --quiet -- AGENTS.md; then
            git diff -- AGENTS.md | head -40
            echo "::error file=AGENTS.md::AGENTS.md is out of date with skills/bachat-bhai/SKILL.md. Run bash scripts/build.sh and commit AGENTS.md."
            exit 1
          fi
